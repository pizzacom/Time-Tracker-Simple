<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#grad)"/>
  <circle cx="256" cy="256" r="160" fill="white" fill-opacity="0.95"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#4f46e5" stroke-width="8"/>
  <!-- Hour marks -->
  <g stroke="#64748b" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="130" x2="256" y2="145"/>
    <line x1="256" y1="367" x2="256" y2="382"/>
    <line x1="130" y1="256" x2="145" y2="256"/>
    <line x1="367" y1="256" x2="382" y2="256"/>
  </g>
  <!-- Clock hands -->
  <line x1="256" y1="256" x2="256" y2="170" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="320" y2="256" stroke="#4f46e5" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="300" y2="300" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="#4f46e5"/>
  <circle cx="256" cy="256" r="6" fill="white"/>
</svg>
